plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def qnnNodeEncoderCaseDir = file("${rootDir}/../QnnNodeEncoderMlpBodyCaseHtpV68")
def qnnBlock000NodeCaseDir = file("${rootDir}/../QnnBlock000NodeCase")
def qnnBlock000EdgeMeshCaseDir = file("${rootDir}/../QnnBlock000EdgeMeshCase")
def qnnBlock000EdgeMeshMlpBodyCaseDir = file("${rootDir}/../QnnBlock000EdgeMeshMlpBodyCase")
def qnnBlock000EdgeMeshMlpBodyQuantCaseDir = file("${rootDir}/../QnnBlock000EdgeMeshMlpBodyQuantCaseHtpV68")
def qnnBlock000EdgeMeshMlpBodyQuantGpuCaseDir = file("${rootDir}/../QnnBlock000EdgeMeshMlpBodyQuantCaseGpu")
def qnnBlock000EdgeMeshFullCaseDir = file("${rootDir}/../QnnBlock000EdgeMeshFullCase")
def qnnBlock001EdgeMeshMlpBodyCaseDir = file("${rootDir}/../QnnBlock001EdgeMeshMlpBodyCase")
def qnnBlock002EdgeMeshMlpBodyCaseDir = file("${rootDir}/../QnnBlock002EdgeMeshMlpBodyCase")
def splitNodeEncoderDir = file("${projectDir}/src/main/assets/split_artifacts/node_encoder")
def generatedQnnAssetRoot = file("$buildDir/generated/qnnNodeEncoderAssets")

android {
    namespace 'com.magcode.hoodonnxtest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.magcode.hoodonnxtest'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/*']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    sourceSets {
        main {
            assets.srcDir(generatedQnnAssetRoot)
        }
    }
}

tasks.register('syncQnnNodeEncoderCaseAssets', Copy) {
    from(qnnNodeEncoderCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_node_encoder_case'))
    from(splitNodeEncoderDir) {
        include 'layernorm_gamma.bin', 'layernorm_beta.bin', 'manifest.json'
    }
}

tasks.register('syncQnnBlock000NodeCaseAssets', Copy) {
    from(qnnBlock000NodeCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_0_node_case'))
}

tasks.register('syncQnnBlock000EdgeMeshCaseAssets', Copy) {
    from(qnnBlock000EdgeMeshCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_0_edge_mesh_case'))
}

tasks.register('syncQnnBlock000EdgeMeshMlpBodyCaseAssets', Copy) {
    from(qnnBlock000EdgeMeshMlpBodyCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_0_edge_mesh_mlp_body_case'))
}

tasks.register('syncQnnBlock000EdgeMeshMlpBodyQuantCaseAssets', Copy) {
    from(qnnBlock000EdgeMeshMlpBodyQuantCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_0_edge_mesh_mlp_body_quant_case_htp_v68'))
}

tasks.register('syncQnnBlock000EdgeMeshMlpBodyQuantGpuCaseAssets', Copy) {
    doFirst {
        delete(new File(generatedQnnAssetRoot, 'qnn_block_0_0_edge_mesh_mlp_body_quant_case_gpu'))
    }
    from(qnnBlock000EdgeMeshMlpBodyQuantGpuCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_0_edge_mesh_mlp_body_quant_case_gpu'))
}

tasks.register('syncQnnBlock000EdgeMeshFullCaseAssets', Copy) {
    from(qnnBlock000EdgeMeshFullCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_0_edge_mesh_full_case'))
}

tasks.register('syncQnnBlock001EdgeMeshMlpBodyCaseAssets', Copy) {
    from(qnnBlock001EdgeMeshMlpBodyCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_1_edge_mesh_mlp_body_case'))
}

tasks.register('syncQnnBlock002EdgeMeshMlpBodyCaseAssets', Copy) {
    from(qnnBlock002EdgeMeshMlpBodyCaseDir)
    into(new File(generatedQnnAssetRoot, 'qnn_block_0_2_edge_mesh_mlp_body_case'))
}

preBuild.dependsOn(
    tasks.named('syncQnnNodeEncoderCaseAssets'),
    tasks.named('syncQnnBlock000NodeCaseAssets'),
    tasks.named('syncQnnBlock000EdgeMeshCaseAssets'),
    tasks.named('syncQnnBlock000EdgeMeshMlpBodyCaseAssets'),
    tasks.named('syncQnnBlock000EdgeMeshMlpBodyQuantCaseAssets'),
    tasks.named('syncQnnBlock000EdgeMeshMlpBodyQuantGpuCaseAssets'),
    tasks.named('syncQnnBlock000EdgeMeshFullCaseAssets'),
    tasks.named('syncQnnBlock001EdgeMeshMlpBodyCaseAssets'),
    tasks.named('syncQnnBlock002EdgeMeshMlpBodyCaseAssets')
)

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'
    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.1'
}
